[project]
name = "grover-slides"
version = "0.1.0"
description = "A five-minute introduction to Grover's algorithm with a geometric appendix"
readme = "README.md"
authors = [
    { name = "arcticronin", email = "ronin.git@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "manim-slides[manim,pyside6]>=5.7.0",
]

[project.scripts]
grover-slides = "grover_slides:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

